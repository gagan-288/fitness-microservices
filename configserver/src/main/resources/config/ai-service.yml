spring:
  data:
   mongodb:
      uri: mongodb://localhost:27017/airecommendationfitness
      database: airecommendationfitness
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: activity-processor-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.fitness.aiservice.model.Activity
        spring.json.trusted.packages: "*"

gemini:
  api:
    key: ${GEMINI_KEY}
    url: ${GEMINI_URL}
    model: gemini-3.5-flash-lite


kafka:
  topic:
    name: activity-events

eureka:
  instance:
    hostname: localhost
    prefer-ip-address: true
    instance-id: localhost:aiservice:8083
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

server:
  port: 8083
